[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gh-health"
version = "0.1.0"
description = "GitHub workflow health monitoring toolkit"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
gh-health = "gh_health.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
