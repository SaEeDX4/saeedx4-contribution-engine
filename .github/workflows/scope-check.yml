name: PAT scope check (manual, read-only)
# PILOT ONLY: verifies what the AUTOMATION_PAT can and cannot do, using
# read-only API calls only. For each repository it prints the permissions
# GitHub reports for this token. push=false outside the two project repos
# proves the fine-grained scope limit where it matters: writes.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print PAT permissions per repository
        env:
          PAT: ${{ secrets.AUTOMATION_PAT }}
        run: |
          for R in saeedx4-contribution-engine saeedx4-achievement-lab interview-assistant-website REAL-TIME-WINDOWS-INTERVIEW-ASSISTANT; do
            echo "== SaEeDX4/$R"
            curl -s -H "Authorization: Bearer $PAT" "https://api.github.com/repos/SaEeDX4/$R" | jq -c '{full_name, private, permissions}'
          done
