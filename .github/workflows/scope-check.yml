name: PAT scope check (manual, read-only)
# PILOT ONLY: verifies what the AUTOMATION_PAT can reach, read-only.
# Note: the `permissions` object in GET /repos responses describes the
# authenticated USER's role on the repo, not the token's scope, so it
# cannot test a fine-grained PAT. The decisive read-only signal is
# GET /user/repos: for a fine-grained PAT it lists only the repositories
# the token was granted access to.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List repositories visible to the PAT
        env:
          PAT: ${{ secrets.AUTOMATION_PAT }}
        run: |
          echo "== GET /user/repos (owner affiliation) as seen by the PAT:"
          curl -s -H "Authorization: Bearer $PAT" "https://api.github.com/user/repos?affiliation=owner&per_page=100" | jq -r '.[].full_name'
          echo "== GET /user:"
          curl -s -H "Authorization: Bearer $PAT" https://api.github.com/user | jq -c '{login, id}'
