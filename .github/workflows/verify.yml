name: Profile verification (full)
# Full verification, GitHub Actions side. Division of labour (see
# ARCHITECTURE-RELIABILITY.md):
# - This workflow verifies the Contribution Graph, ledger comparison,
#   attribution and weekly-plan compliance, read-only, and uploads its
#   JSON report as an artifact. It never writes to any repository.
# - Achievements have no GitHub API; badge reading belongs to the
#   Muse sweep layer (signed-in browser), 3x daily.
# - The watchdog workflow recovers slots GitHub's scheduler drops.
#
# Scheduling reliability: GitHub did not honour the `timezone:` field
# in this repo's observed Nov 16-17, 2026 runs (runs fired at
# UTC-interpreted times). The cron list therefore covers BOTH UTC
# phases of each Vancouver slot (PST = UTC-8, PDT = UTC-7):
#   08:07 Vancouver = 15:07 / 16:07 UTC
#   15:07 Vancouver = 22:07 / 23:07 UTC
#   22:07 Vancouver = 05:07 / 06:07 UTC (next UTC day)
# verify/slotguard.py runs first and turns off-phase firings into
# no-ops, delayed firings into DELAYED reports, and stale executions
# into records that perform no work. Exactly one firing per slot per
# local day performs verification.
on:
  schedule:
    - cron: "7 5,6,15,16,22,23 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Recovery slot id (YYYY-MM-DDTHH:MM, America/Vancouver)"
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: verify
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Full verification (slot-guarded)
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_SLOT: ${{ inputs.slot }}
          VERIFY_REPORT_PATH: verify-report.json
        run: python -m verify.full_verify
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verify-report-${{ github.run_id }}
          path: verify-report.json
          if-no-files-found: ignore
          retention-days: 30
